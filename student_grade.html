<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grades</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Section 1: List of enrolled students (rows are generated by script.js) -->
  <h1>List of Enrolled Students</h1>

  <table id="studentTable">
    <thead>
      <tr>
        <th>Student Name</th>
        <th>Grade</th>
      </tr>
    </thead>
    <tbody id="studentList">
      <!-- Filled in by displayStudents() -->
    </tbody>
  </table>

  <!-- Button that triggers the grade evaluation -->
  <button id="showBtn" onclick="showGradeEquivalents()">Show Grade Equivalent</button>

  <!-- Section 2: Grade equivalents (rows are generated by script.js) -->
  <div id="result"></div>

  <!-- External JS (placed at the end so the elements above already exist) -->
  <script src="js/script.js"></script>
</body>
</html>
